<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ES242 TA Leaderboard (internal)</title>
  <link rel="stylesheet" href="../../assets/course-theme.css">
  <script>
    var storedTheme = localStorage.getItem("iitgn-course-theme");
    document.documentElement.dataset.theme =
      storedTheme === "dark" || storedTheme === "light" ? "dark" : "grid";
  </script>
  <style>
    .ta-tabs { display:flex; flex-wrap:wrap; gap:6px; margin:18px 0 6px; border-bottom:1px solid var(--line,#ddd); }
    .ta-tab { background:none; border:none; padding:8px 14px; font:inherit; cursor:pointer; color:var(--muted,#666); border-bottom:2px solid transparent; }
    .ta-tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--ink); font-weight:600; }
    .ta-panel { margin-top:14px; }
    .cs-wrap { overflow-x:auto; }
    .ta-panel table { border-collapse:collapse; }
    .ta-panel th, .ta-panel td { padding:8px 11px; border-bottom:1px solid var(--line,#eee); text-align:left; white-space:nowrap; }
    .ta-panel th:first-child, .ta-panel td:first-child { text-align:center; width:44px; }
    .ta-panel .ta-col { text-align:left; min-width:150px; }
    .ta-panel th.cnum, .ta-panel td.cnum { text-align:center; min-width:58px; font-variant-numeric:tabular-nums; }
    .ta-panel th.num, .ta-panel td.num { text-align:right; font-variant-numeric:tabular-nums; }
    .ta-panel td.tot { font-weight:600; }
    .ta-panel .cdate { font-weight:400; font-size:.78em; color:var(--muted,#777); margin-top:2px; }
    .ta-panel .z { color:#cfcfcf; }
    .ta-panel tr:hover td { background: var(--code-bg,#f6f6f6); }
    .muted { color:var(--muted,#777); }
    .note { font-size:.9em; color:var(--muted,#777); margin:6px 0 0; }
  </style>
</head>
<body>
  <main class="shell" id="main-content">
    <section class="hero">
      <p class="eyebrow">Internal &middot; not public</p>
      <h1>ES242 TA Leaderboard</h1>
      <p class="lead">Problems solved per contest since the course began (4 August 2026) &mdash; newest contest first.</p>
      <div class="last-updated" id="updated"></div>
    </section>

    <div class="ta-tabs" role="tablist" id="tabs"></div>
    <div class="ta-panel" id="panel"><p id="status" class="note">Loading&hellip;</p></div>
  </main>

  <script src="../../assets/course-theme.js"></script>
  <script>
    var PLATFORMS = [
      { key:"codeforces", label:"Codeforces", url:function(h){return "https://codeforces.com/profile/"+encodeURIComponent(h);} },
      { key:"leetcode",   label:"LeetCode",   url:function(h){return "https://leetcode.com/u/"+encodeURIComponent(h)+"/";} },
      { key:"atcoder",    label:"AtCoder",    url:function(h){return "https://atcoder.jp/users/"+encodeURIComponent(h);} },
      { key:"codechef",   label:"CodeChef",   url:function(h){return "https://www.codechef.com/users/"+encodeURIComponent(h);} }
    ];
    var DATA = null, current = "codeforces";

    function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

    var MEDALS = ["🥇","🥈","🥉"];

    // TAs with a handle on this platform, sorted by total problems solved (desc).
    function taRows(key){
      var rows = (DATA.tas||[]).map(function(t){ return { name:t.name, p:t[key] }; })
        .filter(function(x){ return x.p && x.p.handle; });
      rows.sort(function(a,b){ var d=(b.p.total||0)-(a.p.total||0); return d || a.name.localeCompare(b.name); });
      return rows;
    }
    // Union of contests across TAs on this platform, newest first.
    function contestCols(rows){
      var m = {};
      rows.forEach(function(x){ (x.p.contests||[]).forEach(function(c){ if(!m[c.code]) m[c.code] = {code:c.code, name:c.name, date:c.date, ts:c.ts||0}; }); });
      var arr = Object.keys(m).map(function(k){ return m[k]; });
      arr.sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
      return arr;
    }
    function shortContest(c){
      var n = c.name || c.code || "", m;
      if ((m = n.match(/AtCoder Beginner Contest\s*(\d+)/i))) return "ABC " + m[1];
      if ((m = n.match(/AtCoder Regular Contest\s*(\d+)/i)))  return "ARC " + m[1];
      if ((m = n.match(/AtCoder Grand Contest\s*(\d+)/i)))    return "AGC " + m[1];
      if ((m = n.match(/Educational Codeforces Round\s*(\d+)/i))) return "Edu " + m[1];
      if ((m = n.match(/Codeforces Round\s*(\d+)/i)))         return "Round " + m[1];
      if ((m = n.match(/Biweekly Contest\s*(\d+)/i)))         return "Biweekly " + m[1];
      if ((m = n.match(/Weekly Contest\s*(\d+)/i)))           return "Weekly " + m[1];
      return c.code || n;
    }

    function render(){
      var plat = PLATFORMS.filter(function(p){return p.key===current;})[0];
      var rows = taRows(current);
      var cols = contestCols(rows);
      var html = '<div class="cs-wrap"><table><thead><tr><th></th><th class="ta-col">TA</th>';
      cols.forEach(function(c){
        html += '<th class="cnum" title="'+esc(c.name)+' &mdash; '+esc(c.date)+'">'+esc(shortContest(c))+
                '<div class="cdate">'+esc((c.date||"").slice(5))+'</div></th>';
      });
      html += '<th class="num">Total</th></tr></thead><tbody>';
      if (!rows.length) {
        html += '<tr><td colspan="'+(cols.length+3)+'" class="muted">No handles submitted yet.</td></tr>';
      } else if (!cols.length) {
        html += '<tr><td colspan="3" class="muted">No contest participation on this platform yet.</td></tr>';
      } else {
        rows.forEach(function(r,i){
          var total = r.p.total || 0;
          var byCode = {}; (r.p.contests||[]).forEach(function(c){ byCode[c.code] = c.solved; });
          var medal = (total>0 && i<3) ? MEDALS[i] : "";
          html += '<tr><td class="medal">'+medal+'</td>'+
                  '<td class="ta-col"><a href="'+plat.url(r.p.handle)+'" target="_blank" rel="noopener">'+esc(r.name)+'</a></td>';
          cols.forEach(function(c){ var v = byCode[c.code]; html += '<td class="cnum">'+(v!=null ? v : '<span class="z">&middot;</span>')+'</td>'; });
          html += '<td class="num tot">'+(total>0 ? total : '<span class="muted">&ndash;</span>')+'</td></tr>';
        });
      }
      html += '</tbody></table></div>';
      document.getElementById("panel").innerHTML = html;
    }

    function buildTabs(){
      var t = document.getElementById("tabs");
      t.innerHTML = "";
      PLATFORMS.forEach(function(p){
        var n = taRows(p.key).length;
        var b = document.createElement("button");
        b.className = "ta-tab"; b.setAttribute("role","tab");
        b.setAttribute("aria-selected", p.key===current ? "true":"false");
        b.textContent = p.label + " (" + n + ")";
        b.addEventListener("click", function(){ current=p.key; buildTabs(); render(); });
        t.appendChild(b);
      });
    }

    // Live nightly data comes from the TA-tracker web app; fall back to the committed snapshot.
    var TA_API = "https://script.google.com/macros/s/AKfycbynrz1waU2yxT8W-JxK-2-VAodOJEvQ0uBlwwgGB0nWoPXvQ7ifmo6UI3A9cKhoFIgh/exec";
    function init(d){
      DATA = d;
      document.getElementById("updated").textContent = d.generated ? ("Last updated: " + d.generated) : "";
      buildTabs(); render();
    }
    function loadStatic(){
      fetch("ta-leaderboard.json?cb="+Date.now())
        .then(function(r){ return r.json(); })
        .then(init)
        .catch(function(){ document.getElementById("status").textContent = "Failed to load data."; });
    }
    fetch(TA_API)
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.tas && d.tas.length) init(d); else loadStatic(); })
      .catch(loadStatic);
  </script>
</body>
</html>
